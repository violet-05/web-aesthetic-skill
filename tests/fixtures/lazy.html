<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Lazy image fixture</title><style>body{margin:0;font:16px/1.6 system-ui}main{padding:24px}#spacer{height:1800px}img{display:block;max-width:100%;width:320px;height:200px;background:#e1ead1}button{padding:12px}</style></head><body><main><h1>滚动后才加载的图片</h1><p>真实 IntersectionObserver 触发，不修改 loading 属性。</p><div id="spacer"></div><img id="lazy" data-src="/ok.svg" alt="滚动后出现的绿色图形" width="320" height="200"><p id="loaded" role="status">尚未加载</p></main><script>const image=document.getElementById('lazy');image.onload=()=>document.getElementById('loaded').textContent='加载完成';const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){image.src=image.dataset.src;observer.disconnect();}},{rootMargin:'0px'});observer.observe(image);</script></body></html>
